services:
  - type: web
    name: freshers-party
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn freshers_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    initialDeployHook: python manage.py seed_demo_media
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: EVENT_REGISTRATION_URL
        value: https://forms.gle/rT1QgLVCPCMPLYyv9
      - key: GOOGLE_FORMS_WEBHOOK_TOKEN
        generateValue: true
